[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flakehound"
version = "0.1.0"
description = "Static analysis of potential flaky-test patterns in Python test suites."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Dharmogata", email = "spectacle2002@gmail.com" }
]
keywords = ["pytest", "testing", "flaky-tests", "static-analysis", "ast", "linter"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Dharmogata/flakehound"
Issues = "https://github.com/Dharmogata/flakehound/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "coverage>=7",
    "ruff>=0.9",
]

[project.scripts]
flakehound = "flakehound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.coverage.run]
source = ["flakehound"]

[tool.coverage.report]
show_missing = true
fail_under = 80
